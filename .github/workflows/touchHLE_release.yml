name: Build touchHLE

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SegaHLE Code
        uses: actions/checkout@v4

      - name: Setup Rust Compiler
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi, aarch64-linux-android

      - name: Build Android Package
        run: |
          echo "Building SegaHLE for Android..."
          cargo build --release --target aarch64-linux-android

      - name: Upload SegaHLE APK
        uses: actions/upload-artifact@v4
        with:
          name: SegaHLE-Android-App
          path: target/aarch64-linux-android/release/
