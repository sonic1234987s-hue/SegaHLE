name: Build touchHLE

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SegaHLE Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK Component
        run: sdkmanager "ndk;25.2.9519653"

      - name: Setup Rust Compiler
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Build Android App Binary
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        run: |
          echo "Compiling SegaHLE Core..."
          cargo build --release --target aarch64-linux-android

      - name: Upload SegaHLE APK
        uses: actions/upload-artifact@v4
        with:
          name: SegaHLE-Android-App
          path: target/aarch64-linux-android/release/
